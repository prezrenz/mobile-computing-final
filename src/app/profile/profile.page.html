<ion-content>
	<div class="main-wrapper flex-col gap-y-4">
		<div
			class="flex flex-col gap-y-4.5 items-center border border-black/20 px-20 py-10 rounded"
		>
			<ion-icon
				class="text-[var(--primary)] text-2xl border border-black/20 rounded-full p-4"
				src="assets/svg/user-solid.svg"
			>
			</ion-icon>

			<div class="flex flex-col items-center">
				<span> {{userService.getUserName()}} </span>
				<span> {{userService.getUserEmail()}} </span>
			</div>
		</div>

		<div class="flex flex-col w-80 text-xs bg-(--primary)/20 p-4 rounded gap-y-1">
			<span class="font-bold">Safety Reminder</span>
			<p>
				BeauWise is strictly an educational tool. It does not diagnose, treat, or replace
				professional medical advice, and its analyses have no approved therapeutic claims.
				Always consult a board-certified dermatologist.
			</p>
		</div>

		<button
			(click)="handleSignOut()"
			class="flex items-center justify-center gap-x-1.5 ion-activatable ripple bg-(--primary) rounded! py-4! px-6!"
		>
			<span class="text-white">Sign out</span>

			@if (signOutMutation.isPending()) {<app-spinner />}
			<ion-ripple-effect></ion-ripple-effect>
		</button>
	</div>
</ion-content>
